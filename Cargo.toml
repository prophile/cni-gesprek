[package]
name = "cni-gesprek"
version = "0.2.0"
edition = "2021"
description = "A CNI plugin for IPv6-only ipvlan L2 networking using random address generation (pseudo-SLAAC) and explicit gateway inheritance."
license = "CC0-1.0"
authors = ["Alistair Lynn <alistair@alynn.co.uk>"]
repository = "https://github.com/prophile/cni-gesprek"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"
