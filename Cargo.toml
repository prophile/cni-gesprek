[package]
name = "cni-gesprek"
version = "0.2.0"
edition = "2021"
description = "A CNI plugin for IPv6-only ipvlan L2 networking using random address generation (pseudo-SLAAC) and explicit gateway inheritance."
license = "CC0-1.0"
authors = ["Alistair Lynn <alistair@alynn.co.uk>"]
repository = "https://github.com/prophile/cni-gesprek"

[features]
testing = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
rand = "0.9.2"
tempfile = "3.0"
wait-timeout = "0.2"
ipnet = "2.9"
regex = "1.10"

[[bin]]
name = "cni-gesprek"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
assert_cmd = "2.0"
predicates = "3.0"
proptest = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "ip_generation_bench"
harness = false
