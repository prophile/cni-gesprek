name: CI

on:
  push:
    branches: [ trunk ]
    tags: [ '*' ]
  pull_request: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Run default tests
      run: cargo test --verbose
    - name: Run all feature tests
      run: cargo test --all-features --verbose
    - name: Test benchmark compilation
      run: cargo bench --no-run
    - name: Check all feature combinations compile
      run: |
        cargo check --all-features
        cargo check --no-default-features
        cargo check --features testing

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Enforce formatting
      run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Linting (default features)
      run: cargo clippy -- -D warnings
    - name: Linting (all features, all targets)
      run: cargo clippy --all-features --all-targets -- -D warnings
    - name: Linting (testing features)
      run: cargo clippy --features testing -- -D warnings
    - name: Linting benchmarks
      run: cargo clippy --benches -- -D warnings

  compile-checks:
    name: Compilation Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Check for deprecation warnings
      run: |
        # Ensure no deprecation warnings in any feature configuration
        cargo build --all-features 2>&1 | tee build.log
        if grep -q "warning.*deprecated" build.log; then
          echo "::error::Deprecation warnings found"
          grep "warning.*deprecated" build.log
          exit 1
        fi
    - name: Verify feature-gated modules compile
      run: |
        # Explicitly test that testing modules compile correctly
        cargo check --features testing
        cargo test --features testing --no-run
    - name: Check documentation builds
      run: cargo doc --no-deps --all-features

  build:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}
    - name: Install cross-compilation tools
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cni-gesprek-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/cni-gesprek
        if-no-files-found: error

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Generate code coverage
      run: |
        cargo tarpaulin --verbose \
          --all-features \
          --workspace \
          --timeout 300 \
          --exclude-files "*/tests/*" "*/benches/*" "*/examples/*" \
          --ignore-panics \
          --out xml \
          --output-dir ./coverage/
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage/cobertura.xml
        fail_ci_if_error: false
        verbose: true
    - name: Check coverage threshold
      run: |
        cargo tarpaulin --verbose \
          --all-features \
          --workspace \
          --timeout 300 \
          --exclude-files "*/tests/*" "*/benches/*" "*/examples/*" "*/src/testing/*" "*/src/bin/*" \
          --ignore-panics \
          --fail-under 90 \
          --output-dir ./coverage/
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/
        if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, fmt, clippy, compile-checks, build, coverage, docker]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}
    - name: Install cross-compilation tools
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}
    - name: Create archive
      run: |
        cd target/${{ matrix.target }}/release
        tar czf cni-gesprek-${{ github.ref_name }}-${{ matrix.target }}.tar.gz cni-gesprek
        mv cni-gesprek-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ github.workspace }}/
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: cni-gesprek-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
        generate_release_notes: true

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, fmt, clippy]
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          cni-gesprek
          ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix={{branch}}-
        labels: |
          org.opencontainers.image.title=CNI-Gesprek
          org.opencontainers.image.description=IPv6-only CNI plugin with cryptographically random IP addresses
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.vendor=CNI-Gesprek Team
    
    - name: Build and push Ubuntu-based image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push Alpine-based image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile.alpine
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          cni-gesprek:alpine-${{ steps.meta.outputs.version }}
          ghcr.io/${{ github.repository }}:alpine-${{ steps.meta.outputs.version }}
          ${{ github.ref == 'refs/heads/trunk' && 'cni-gesprek:alpine-latest' || '' }}
          ${{ github.ref == 'refs/heads/trunk' && format('ghcr.io/{0}:alpine-latest', github.repository) || '' }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=alpine
        cache-to: type=gha,mode=max,scope=alpine
        build-args: |
          RUST_VERSION=1.75
          UBUNTU_VERSION=22.04

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name != 'pull_request'
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
        format: sarif
        output: trivy-results.sarif
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif
